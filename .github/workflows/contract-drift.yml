name: API Contract Drift Detection

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'scripts/check-contract-drift.js'
      - 'scripts/check-contract-compatibility.js'
      - 'contracts/compat/**'
      - '.github/workflows/contract-drift.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'contracts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-drift:
    name: Check API Contract Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Generate OpenAPI spec
        run: |
          cd backend
          npm run build
          # Generate OpenAPI spec from source
          node -e "
            const { generateOpenApiSpec } = require('./src/config/swagger.js');
            const fs = require('fs');
            const spec = generateOpenApiSpec();
            fs.writeFileSync('openapi-current.json', JSON.stringify(spec, null, 2));
          "

      - name: Check for baseline spec
        id: baseline
        run: |
          if [ -f backend/openapi-baseline.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No baseline spec found. Creating baseline from current spec."
            cp backend/openapi-current.json backend/openapi-baseline.json
          fi

      - name: Run contract drift check
        if: steps.baseline.outputs.exists == 'true'
        run: |
          node scripts/check-contract-drift.js \
            --baseline=backend/openapi-baseline.json \
            --current=backend/openapi-current.json \
            --fail-on-breaking \
            --output=contract-drift-report.json

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-drift-report
          path: contract-drift-report.json

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'contract-drift-report.json';
            
            if (!fs.existsSync(reportPath)) {
              console.log('No drift report found');
              return;
            }
            
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
            const { breaking, potentiallyBreaking, nonBreaking } = report.summary;
            
            let body = '## 🔍 API Contract Drift Report\n\n';
            body += `| Type | Count |\n|------|-------|\n`;
            body += `| 🚨 Breaking | ${breaking} |\n`;
            body += `| ⚠️ Potentially Breaking | ${potentiallyBreaking} |\n`;
            body += `| ✅ Non-Breaking | ${nonBreaking} |\n\n`;
            
            if (breaking > 0) {
              body += '### 🚨 Breaking Changes\n\n';
              for (const change of report.changes.filter((c: any) => c.type === 'breaking')) {
                body += `- **${change.method} ${change.path}**: ${change.description}\n`;
              }
              body += '\n';
            }
            
            if (potentiallyBreaking > 0) {
              body += '### ⚠️ Potentially Breaking Changes\n\n';
              for (const change of report.changes.filter((c: any) => c.type === 'potentially-breaking')) {
                body += `- **${change.method} ${change.path}**: ${change.description}\n`;
              }
              body += '\n';
            }
            
            body += '---\n*Generated by API Contract Drift Detection workflow*';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  contract-compatibility:
    name: Check Cross-Contract Interface Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run cross-contract compatibility check
        run: |
          node scripts/check-contract-compatibility.js \
            --fixtures=contracts/compat/fixtures \
            --baseline=contracts/compat/baseline.json \
            --output=contract-compatibility-report.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-compatibility-report
          path: contract-compatibility-report.json

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'contract-compatibility-report.json';

            if (!fs.existsSync(reportPath)) {
              console.log('No compatibility report found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
            const { breaking, nonBreaking, versionBumped } = report.summary;

            let body = '## 🔗 Cross-Contract Compatibility Report\n\n';
            body += `| Type | Count |\n|------|-------|\n`;
            body += `| 🚨 Breaking | ${breaking} |\n`;
            body += `| ✅ Non-Breaking | ${nonBreaking} |\n`;
            body += `| 🔖 Version Bumped | ${versionBumped ? 'yes' : 'no'} |\n\n`;

            if (breaking > 0) {
              body += '### 🚨 Breaking Interface Changes\n\n';
              for (const change of report.changes.filter((c) => c.type === 'breaking')) {
                body += `- **${change.contract}::${change.symbol}**: ${change.description}\n`;
              }
              body += '\n';
            }

            body += '---\n*Generated by Cross-Contract Interface Compatibility check*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  frontend-types:
    name: Generate & Validate Frontend Types
    runs-on: ubuntu-latest
    needs: contract-drift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend && npm ci

      - name: Generate API types
        run: |
          cd frontend
          npm run generate:api-types

      - name: Validate TypeScript
        run: |
          cd frontend
          npm run typecheck

      - name: Upload generated types
        uses: actions/upload-artifact@v7
        with:
          name: frontend-api-types
          path: frontend/src/types/api/

  update-baseline:
    name: Update Baseline Spec (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend && npm ci

      - name: Generate OpenAPI spec
        run: |
          cd backend
          npm run build
          node -e "
            const { generateOpenApiSpec } = require('./src/config/swagger.js');
            const fs = require('fs');
            const spec = generateOpenApiSpec();
            fs.writeFileSync('openapi-baseline.json', JSON.stringify(spec, null, 2));
          "

      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/openapi-baseline.json
          git diff --staged --quiet || git commit -m "chore: update OpenAPI baseline spec [skip ci]"
          git push