# Issue #409 – Reusable workflow: end-to-end and mobile performance tests
# Issue #406 – mobile-chrome and mobile-safari Playwright projects run here.
# Issue #578 – critical full-stack journeys run against a hermetic Stellar test
# environment (PostgreSQL, Redis, backend, frontend, Soroban-compatible ledger).
# Least-privilege: read-only checkout; uploads artifacts on failure; always tears
# down the hermetic stack, even after a failed run.
name: E2E Tests (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment for the synthetic journey run
        required: false
        type: string
        default: staging
      canary_traffic_share:
        description: Bounded share of traffic routed to the canary (percent)
        required: false
        type: number
        default: 10
      commit_sha:
        description: Commit under test
        required: false
        type: string
        default: ""
      image_digest:
        description: Image digest under test
        required: false
        type: string
        default: ""
      config_version:
        description: Configuration version under test
        required: false
        type: string
        default: ""
    outputs:
      gate_result:
        description: Aggregate promotion gate result
        value: ${{ jobs.gates.outputs.gate_result }}

jobs:
  canary:
    name: Canary stage (bounded traffic)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      canary_ready:
        description: Whether the canary stage passed
        value: ${{ steps.canary.outputs.canary_ready }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers (chromium + mobile webkit)
        # chromium covers desktop + mobile-chrome; webkit covers mobile-safari.
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Start hermetic Stellar test environment (Issue #578)
        # Brings up PostgreSQL, Redis, backend, frontend and a Soroban-compatible
        # test ledger with controlled contract deployments and wallet fixtures.
        # No public RPC or production credentials are required.
        run: docker compose -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
          CI: "true"
      - name: Run e2e tests – desktop chromium
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Run e2e tests – mobile-chrome (Issue #406)
        run: npx playwright test --project=mobile-chrome
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Run e2e tests – mobile-safari (Issue #406)
        run: npx playwright test --project=mobile-safari
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Collect hermetic environment diagnostics (Issue #578)
        if: always()
        run: |
          mkdir -p frontend/playwright-report/hermetic
          docker compose -f docker-compose.e2e.yml ps > frontend/playwright-report/hermetic/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs --no-color --tail=200 > frontend/playwright-report/hermetic/compose-logs.txt 2>&1 || true
      - name: Tear down hermetic Stellar test environment (Issue #578)
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence
          path: deployment-evidence.txt

  rollback:
    name: Rollback (forward-compatible)
    needs: gates
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Roll back without resubmitting pending chain transactions
        run: |
          set -euo pipefail
          # Rollback preserves database forward-compatibility: schema changes are
          # additive and never reverted. Pending chain transactions are left
          # untouched and are not resubmitted during rollback.
          echo "Rolling back application to previous release"
          echo "Database schema left forward-compatible (no destructive migration)"
          echo "Pending chain transactions preserved (not resubmitted)"
