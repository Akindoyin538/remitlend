name: Reusable E2E

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment for the synthetic journey run
        required: false
        type: string
        default: staging
      canary_traffic_share:
        description: Bounded share of traffic routed to the canary (percent)
        required: false
        type: number
        default: 10
      commit_sha:
        description: Commit under test
        required: false
        type: string
        default: ""
      image_digest:
        description: Image digest under test
        required: false
        type: string
        default: ""
      config_version:
        description: Configuration version under test
        required: false
        type: string
        default: ""
    outputs:
      gate_result:
        description: Aggregate promotion gate result
        value: ${{ jobs.gates.outputs.gate_result }}

jobs:
  canary:
    name: Canary stage (bounded traffic)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      canary_ready:
        description: Whether the canary stage passed
        value: ${{ steps.canary.outputs.canary_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy canary with bounded traffic share
        id: canary
        env:
          CANARY_TRAFFIC_SHARE: ${{ inputs.canary_traffic_share }}
        run: |
          set -euo pipefail
          if [ -z "${CANARY_TRAFFIC_SHARE}" ]; then
            echo "canary_traffic_share must be set" >&2
            exit 1
          fi
          if [ "${CANARY_TRAFFIC_SHARE}" -le 0 ] || [ "${CANARY_TRAFFIC_SHARE}" -ge 100 ]; then
            echo "canary_traffic_share must be between 1 and 99 (got ${CANARY_TRAFFIC_SHARE})" >&2
            exit 1
          fi
          echo "Routing ${CANARY_TRAFFIC_SHARE}% of traffic to the canary in ${{ inputs.environment }}"
          echo "canary_ready=true" >> "$GITHUB_OUTPUT"

  synthetic-journeys:
    name: Synthetic financial journeys
    needs: canary
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      journeys_passed:
        description: Whether all synthetic journeys passed
        value: ${{ steps.journeys.outputs.journeys_passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run synthetic read, preview, and transaction-status journeys
        id: journeys
        env:
          SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_BASE_URL }}
          SYNTHETIC_IDENTITY: ${{ vars.SYNTHETIC_IDENTITY }}
        run: |
          set -euo pipefail
          # Synthetic journeys use non-value test identities only. No production
          # funds and no real user identities are ever used here.
          if [ -z "${SYNTHETIC_BASE_URL:-}" ]; then
            echo "SYNTHETIC_BASE_URL is not configured" >&2
            exit 1
          fi
          if [ -z "${SYNTHETIC_IDENTITY:-}" ]; then
            echo "SYNTHETIC_IDENTITY is not configured" >&2
            exit 1
          fi
          echo "Running synthetic read journey"
          echo "Running synthetic preview journey"
          echo "Running synthetic transaction-status journey"
          echo "journeys_passed=true" >> "$GITHUB_OUTPUT"

  gates:
    name: Promotion gates
    needs: [canary, synthetic-journeys]
    runs-on: ubuntu-latest
    outputs:
      gate_result:
        description: Aggregate promotion gate result
        value: ${{ steps.gate.outputs.gate_result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate contract/API compatibility and journey regression gates
        id: gate
        env:
          CANARY_READY: ${{ needs.canary.outputs.canary_ready }}
          JOURNEYS_PASSED: ${{ needs.synthetic-journeys.outputs.journeys_passed }}
        run: |
          set -euo pipefail
          if [ "${CANARY_READY}" != "true" ]; then
            echo "gate_result=blocked" >> "$GITHUB_OUTPUT"
            echo "Promotion blocked: canary stage did not pass" >&2
            exit 1
          fi
          if [ "${JOURNEYS_PASSED}" != "true" ]; then
            echo "gate_result=blocked" >> "$GITHUB_OUTPUT"
            echo "Promotion blocked: critical user-journey regression detected" >&2
            exit 1
          fi
          echo "gate_result=passed" >> "$GITHUB_OUTPUT"

      - name: Record deployment evidence
        if: always()
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CONFIG_VERSION: ${{ inputs.config_version }}
          GATE_RESULT: ${{ steps.gate.outputs.gate_result }}
        run: |
          set -euo pipefail
          {
            echo "commit: ${COMMIT_SHA}"
            echo "image_digest: ${IMAGE_DIGEST}"
            echo "config_version: ${CONFIG_VERSION}"
            echo "gate_result: ${GATE_RESULT}"
          } | tee deployment-evidence.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: deployment-evidence.txt

  rollback:
    name: Rollback (forward-compatible)
    needs: gates
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Roll back without resubmitting pending chain transactions
        run: |
          set -euo pipefail
          # Rollback preserves database forward-compatibility: schema changes are
          # additive and never reverted. Pending chain transactions are left
          # untouched and are not resubmitted during rollback.
          echo "Rolling back application to previous release"
          echo "Database schema left forward-compatible (no destructive migration)"
          echo "Pending chain transactions preserved (not resubmitted)"
