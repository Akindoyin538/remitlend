# Issue #409 – Reusable workflow: end-to-end and mobile performance tests
# Issue #406 – mobile-chrome and mobile-safari Playwright projects run here.
# Issue #578 – critical full-stack journeys run against a hermetic Stellar test
# environment (PostgreSQL, Redis, backend, frontend, Soroban-compatible ledger).
# Least-privilege: read-only checkout; uploads artifacts on failure; always tears
# down the hermetic stack, even after a failed run.
name: E2E Tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers (chromium + mobile webkit)
        # chromium covers desktop + mobile-chrome; webkit covers mobile-safari.
        run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - name: Start hermetic Stellar test environment (Issue #578)
        # Brings up PostgreSQL, Redis, backend, frontend and a Soroban-compatible
        # test ledger with controlled contract deployments and wallet fixtures.
        # No public RPC or production credentials are required.
        run: docker compose -f docker-compose.e2e.yml up -d --wait
        env:
          NODE_ENV: test
          CI: "true"
      - name: Run e2e tests – desktop chromium
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Run e2e tests – mobile-chrome (Issue #406)
        run: npx playwright test --project=mobile-chrome
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Run e2e tests – mobile-safari (Issue #406)
        run: npx playwright test --project=mobile-safari
        working-directory: frontend
        env:
          NODE_ENV: test
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
      - name: Collect hermetic environment diagnostics (Issue #578)
        if: always()
        run: |
          mkdir -p frontend/playwright-report/hermetic
          docker compose -f docker-compose.e2e.yml ps > frontend/playwright-report/hermetic/compose-ps.txt 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs --no-color --tail=200 > frontend/playwright-report/hermetic/compose-logs.txt 2>&1 || true
      - name: Tear down hermetic Stellar test environment (Issue #578)
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
