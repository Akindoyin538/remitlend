# ─── RemitLend CI ─────────────────────────────────────────────────────────────
#
# Issue #409 – split CI into least-privilege reusable workflows.
#
# This orchestrator only declares *which* reusable jobs to run and *when*.
# Each job lives in a dedicated reusable workflow under .github/workflows/
# with the minimum permissions it actually needs (mostly `contents: read`).
#
# Dependency graph:
#   supply-chain-audit ──► money-policy ──► backend
#                                       └──► frontend ──► e2e (+ mobile #406)
#                                       └──► scripts-typecheck
#                       ──► migration-check (path-filtered)
#                       ──► contracts ──► contract-compatibility (#407)
# ─────────────────────────────────────────────────────────────────────────────
name: RemitLend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Issue #569: restore verification must also run on a defined cadence and
  # after backup-format or schema/migration changes (see restore-verification).
  schedule:
    - cron: '0 3 * * *'

# Deny all permissions at the root level; individual reusable workflows
# declare only what they need (all are contents: read only).
permissions: {}

jobs:
  # ── 1. Supply-chain audit ───────────────────────────────────────────────────
  supply-chain-audit:
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    permissions:
      contents: read

  # ── 2. Money-policy drift check ─────────────────────────────────────────────
  money-policy:
    needs: supply-chain-audit
    uses: ./.github/workflows/reusable-money-policy.yml
    permissions:
      contents: read

  # ── 3. Backend lint / build / test ──────────────────────────────────────────
  backend:
    needs: [supply-chain-audit, money-policy]
    uses: ./.github/workflows/reusable-backend.yml
    permissions:
      contents: read

  # ── 4. Migration path filter ─────────────────────────────────────────────────
  # Checks whether backend/migrations/** or backend/package.json changed.
  # The output is consumed by the migration-check job below.
  migration-paths:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'backend/migrations/**'
              - 'backend/package.json'

  # ── 5. Migration round-trip check ────────────────────────────────────────────
  migration-check:
    needs: [supply-chain-audit, migration-paths]
    if: github.event_name == 'push' || needs.migration-paths.outputs.migrations == 'true'
    uses: ./.github/workflows/reusable-migration-check.yml
    permissions:
      contents: read

  # ── 6. Frontend lint / build / test / perf-budget ────────────────────────────
  # Issue #406: mobile performance budget check runs inside this workflow.
  frontend:
    needs: [supply-chain-audit, money-policy]
    uses: ./.github/workflows/reusable-frontend.yml
    permissions:
      contents: read

  # ── 7. Scripts typecheck ─────────────────────────────────────────────────────
  scripts-typecheck:
    needs: supply-chain-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: scripts
      - name: Type check deploy scripts
        run: npm run typecheck
        working-directory: scripts

  # ── 8. Env-docs consistency ──────────────────────────────────────────────────
  env-docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check env docs are in sync
        run: node scripts/check-env-docs.mjs

  # ── 9. Error-code mapping check ──────────────────────────────────────────────
  error-code-mapping-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check every backend ErrorCode has a frontend message mapping
        run: node scripts/check-error-code-mappings.mjs

  # ── 10. End-to-end tests (desktop + mobile) ───────────────────────────────────
  # Issue #406: mobile-chrome and mobile-safari Playwright projects run here.
  e2e:
    needs: [supply-chain-audit, frontend]
    if: github.event_name == 'push' || contains(github.event.pull_request.changed_files, 'frontend/')
    uses: ./.github/workflows/reusable-e2e.yml
    permissions:
      contents: read

  # ── 11. Smart-contract CI ─────────────────────────────────────────────────────
  contracts:
    needs: money-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts
            contracts/fuzz
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: contracts
      - name: Run tests
        run: cargo test -- --test-threads=1
        working-directory: contracts
      - name: Formal verification (loan_manager invariants)
        # Dedicated gate for the safety invariants proven in
        # contracts/loan_manager/src/formal_verification.rs (issue #46):
        # loan <= pool balance, collateral accounted exactly, repayment
        # monotonicity, non-negative interest/fees/credit score, and the
        # max_loan_amount ceiling. Kept as its own step so a regression here
        # is unambiguous in the CI log.
        run: cargo test -p loan_manager formal_verification -- --test-threads=1 --nocapture
        working-directory: contracts
      - name: Build contracts for wasm32 and enforce size budget
        run: |
          set -euo pipefail

          cargo build --target wasm32-unknown-unknown --release

          # Generous initial budget: 256 KiB per contract. Tighten after baseline optimization.
          max_bytes=$((256 * 1024))
          shopt -s nullglob
          wasm_files=(target/wasm32-unknown-unknown/release/*.wasm)

          if [ "${#wasm_files[@]}" -eq 0 ]; then
            echo "::error::No wasm artifacts were produced."
            exit 1
          fi

          for wasm in "${wasm_files[@]}"; do
            size_bytes=$(stat -c%s "$wasm")
            size_kib=$(( (size_bytes + 1023) / 1024 ))
            echo "$(basename "$wasm"): ${size_bytes} bytes (${size_kib} KiB), budget ${max_bytes} bytes"

            if [ "$size_bytes" -gt "$max_bytes" ]; then
              echo "::error file=$wasm::WASM artifact exceeds the 256 KiB per-contract budget."
              exit 1
            fi
          done
        working-directory: contracts
      - name: Analyze per-function contract sizes
        run: |
          bash ../scripts/analyze-contract-sizes.sh ./target/wasm32-unknown-unknown/release
        working-directory: contracts
      - name: Check for size regressions
        if: github.event_name == 'pull_request'
        run: |
          bash ../scripts/check-wasm-size-regression.sh origin/main ./target/wasm32-unknown-unknown/release || exit_code=$?
          if [ "${exit_code:-0}" -ne 0 ]; then
            echo "::warning::Size regression detected. Run optimization analysis locally:"
            echo "  bash scripts/optimize-wasm-sizes.sh target/wasm32-unknown-unknown/release"
            exit 1
          fi
        working-directory: contracts
        continue-on-error: true
      - name: Generate

  # ── 12. Backup restore verification (issue #569) ─────────────────────────────
  # Restores an encrypted backup into a disposable environment, runs integrity
  # checks, measures recovery time against the documented RPO/RTO, and records
  # evidence. Runs nightly and whenever backup-format or schema/migration
  # changes land. Fails (and pages the owning team) when the recovery objective
  # is unmet, which blocks release.
  restore-verification:
    needs: [supply-chain-audit, migration-paths]
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      needs.migration-paths.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Restore backup into disposable environment and verify
        id: verify
        env:
          # Isolated, disposable credentials only — never production secrets.
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_VERIFICATION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.RESTORE_VERIFICATION_BACKUP_KEY }}
          # Documented recovery objectives (see backend/docs/SLOs.md).
          RPO_MINUTES: '60'
          RTO_MINUTES: '120'
        run: |
          set -euo pipefail
          node scripts/verify-backup-restore.mjs \
            --evidence-out restore-verification-evidence.json \
            --rpo-minutes "$RPO_MINUTES" \
            --rto-minutes "$RTO_MINUTES"

      - name: Upload restore verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-verification-evidence
          path: restore-verification-evidence.json
          retention-days: 90

      - name: Page owning team on failed verification
        if: failure()
        run: |
          echo "::error::Backup restore verification failed — recovery objective unmet. Paging owning team."
          # Release is blocked because this job is a required status check.
          exit 1
