# Issue #407 – Deployed-contract compatibility suite
# Issue #409 – Packaged as a least-privilege reusable workflow.
# Issue #246 – Validates storage migration manifests for every contract version.
#
# Validates that the env-var contract IDs are well-formed, present in
# docs/deployed-contracts.md, that the configured RPC is reachable, and that
# every contract version has a storage migration manifest with a documented
# rollback path. The check is read-only and requires no elevated permissions.
name: Contract Compatibility (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract-compatibility:
    name: Deployed-contract compatibility suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run compatibility suite
        # SKIP_NETWORK_PROBE=true avoids flaky failures when testnet is
        # unreachable from sandboxed CI runners. Remove the override (or
        # set it to false) to enable live RPC probing.
        run: node scripts/check-deployed-contracts.mjs
        env:
          SKIP_NETWORK_PROBE: "true"
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          # Contract IDs below use the same placeholder values as the backend
          # test suite. Replace with real IDs in repository secrets once
          # contracts are deployed (see docs/deployed-contracts.md).
          LOAN_MANAGER_CONTRACT_ID: ${{ secrets.LOAN_MANAGER_CONTRACT_ID }}
          LENDING_POOL_CONTRACT_ID: ${{ secrets.LENDING_POOL_CONTRACT_ID }}
          REMITTANCE_NFT_CONTRACT_ID: ${{ secrets.REMITTANCE_NFT_CONTRACT_ID }}
          MULTISIG_GOVERNANCE_CONTRACT_ID: ${{ secrets.MULTISIG_GOVERNANCE_CONTRACT_ID }}
      - name: Validate storage migration manifests
        # Issue #246 – Every contract version must ship a storage migration
        # manifest (version id, storage keys/layout, migration steps, rollback
        # path). This step fails closed if any manifest is missing or malformed
        # so a version cannot be deployed without a documented migration.
        run: node scripts/check-migration-manifests.mjs
        env:
          MIGRATION_MANIFEST_DIR: contracts/migrations
          # Fail the job (rather than warn) when a manifest is absent so the
          # compatibility gate stays authoritative.
          MIGRATION_MANIFEST_STRICT: "true"
