# Issue #409 – Reusable workflow: backend lint / build / test
# Least-privilege: read-only checkout; no deployment permissions.
name: Backend CI (reusable)

on:
  workflow_call:
    inputs:
      run-fault-injection:
        description: "Run the deterministic dependency-failure (fault-injection) suite"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Build
        run: npm run build
        working-directory: backend
      - name: Type check
        run: npm run typecheck
        working-directory: backend
      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://user:pass@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          STELLAR_RPC_URL: https://rpc.test.invalid
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          LOAN_MANAGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LENDING_POOL_CONTRACT_ID: CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          REMITTANCE_NFT_CONTRACT_ID: CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
          MULTISIG_GOVERNANCE_CONTRACT_ID: CEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          POOL_TOKEN_ADDRESS: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          LOAN_MANAGER_ADMIN_SECRET: test_admin_secret
          INTERNAL_API_KEY: test_internal_api_key
          FRONTEND_URL: https://frontend.example.com
      - name: Run dependency-failure fault-injection suite
        if: ${{ inputs.run-fault-injection }}
        run: npm run test:fault-injection
        working-directory: backend
        env:
          NODE_ENV: test
          # Deterministic, bounded, offline: no public network access.
          FAULT_INJECTION: "1"
          FAULT_INJECTION_SEED: "574"
          FAULT_INJECTION_TIMEOUT_MS: "30000"
          DATABASE_URL: postgres://user:pass@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          STELLAR_RPC_URL: https://rpc.test.invalid
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          LOAN_MANAGER_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LENDING_POOL_CONTRACT_ID: CBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          REMITTANCE_NFT_CONTRACT_ID: CDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
          MULTISIG_GOVERNANCE_CONTRACT_ID: CEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          POOL_TOKEN_ADDRESS: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
          LOAN_MANAGER_ADMIN_SECRET: test_admin_secret
          INTERNAL_API_KEY: test_internal_api_key
          FRONTEND_URL: https://frontend.example.com
      - name: Scan for plaintext PII in logs
        run: |
          echo "Scanning for plaintext PII in logger output patterns..."
          PII_PATTERNS=(
            'logger.*\.info.*recipient_email'
            'logger.*\.info.*recipient_phone'
            'logger.*\.info.*recipient_name'
            'console\.log.*email.*@.*\.com'
            'console\.log.*phone.*\+[0-9]'
          )
          FOUND=0
          for pattern in "${PII_PATTERNS[@]}"; do
            if grep -rn "$pattern" src/ --include="*.ts" 2>/dev/null; then
              echo "::error::PII leak detected in logger output: $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No plaintext PII found in logger output."
        working-directory: backend
