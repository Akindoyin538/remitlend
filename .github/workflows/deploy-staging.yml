name: Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

env:
  # Pinned contract build toolchain (issue #537). A clean checkout with these
  # exact versions must produce byte-identical optimized WASM. Bump these only
  # together with contracts/release-manifest.json (see contracts/REPRODUCIBILITY.md).
  RUST_TOOLCHAIN: "1.81.0"
  WASM_TARGET: "wasm32-unknown-unknown"
  STELLAR_CLI_VERSION: "21.2.0"
  SOROBAN_OPT_VERSION: "21.0.0"
  CONTRACTS_DIR: "contracts"
  RELEASE_MANIFEST: "contracts/release-manifest.json"

jobs:
  # Reproducibility gate: builds optimized WASM from a clean checkout with the
  # pinned toolchain and compares digests against the approved release manifest.
  # Reported as its own job so reproducibility failures are distinct from
  # contract test failures.
  verify-contracts-reproducible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          set -e
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup target add "${WASM_TARGET}" --toolchain "${RUST_TOOLCHAIN}"
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Install pinned Stellar CLI and soroban-opt
        run: |
          set -e
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          curl -sSL "https://github.com/stellar/soroban-opt/releases/download/v${SOROBAN_OPT_VERSION}/soroban-opt-${SOROBAN_OPT_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin soroban-opt
          stellar --version
          soroban-opt --version

      - name: Build optimized WASM artifacts
        run: |
          set -e
          cd "${CONTRACTS_DIR}"
          cargo build --release --target "${WASM_TARGET}"
          mkdir -p target/optimized
          for wasm in target/${WASM_TARGET}/release/*.wasm; do
            name=$(basename "${wasm}")
            soroban-opt optimize --strip-all "${wasm}" "target/optimized/${name}"
          done
          ls -l target/optimized

      - name: Verify artifact digests against release manifest
        run: |
          set -e
          cd "${CONTRACTS_DIR}"
          if [ ! -f "release-manifest.json" ]; then
            echo "::error::release manifest ${RELEASE_MANIFEST} is missing; refusing to proceed"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const manifest = JSON.parse(fs.readFileSync("release-manifest.json", "utf8"));
            const dir = "target/optimized";
            const approved = manifest.artifacts || {};
            const files = fs.readdirSync(dir).filter((f) => f.endsWith(".wasm"));
            if (files.length === 0) {
              console.error("::error::no optimized WASM artifacts were produced");
              process.exit(1);
            }
            let failed = false;
            for (const file of files) {
              const digest = "sha256:" + crypto.createHash("sha256").update(fs.readFileSync(path.join(dir, file))).digest("hex");
              const expected = approved[file];
              if (!expected) {
                console.error(`::error::${file} digest ${digest} is absent from the approved release manifest`);
                failed = true;
              } else if (expected !== digest) {
                console.error(`::error::${file} digest mismatch: built ${digest}, approved ${expected}`);
                failed = true;
              } else {
                console.log(`${file} OK (${digest})`);
              }
            }
            if (failed) {
              console.error("::error::reproducibility check failed; refusing to deploy");
              process.exit(1);
            }
            console.log("All optimized WASM artifacts match the approved release manifest.");
          '

  build-and-push:
    needs: verify-contracts-reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup current staging-latest as staging-previous
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            if docker pull ${REPO}:staging-latest; then
              docker tag ${REPO}:staging-latest ${REPO}:staging-previous || true
              docker push ${REPO}:staging-previous || true
            fi
          done

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-latest
          target: production
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-latest
          target: runner

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RPC_URL=${{ vars.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_EXPLORER_URL=${{ vars.NEXT_PUBLIC_EXPLORER_URL }}
            NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID || vars.NEXT_PUBLIC_MANAGER_CONTRACT_ID }}
            NEXT_PUBLIC_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_POOL_CONTRACT_ID }}
            NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID=${{ vars.NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID }}
            NEXT_PUBLIC_NFT_CONTRACT_ID=${{ vars.NEXT_PUBLIC_NFT_CONTRACT_ID }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          # Without this, trivy-action builds the SARIF with ALL severities and
          # the exit-code then trips on any vulnerability (e.g. the existing
          # HIGH axios advisories) — not just CRITICAL as the step intends.
          # Limiting the report to the requested severity makes the gate fail
          # only on genuine CRITICAL findings.
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner for frontend (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner for frontend (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'frontend-trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload frontend Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'frontend-trivy-results.sarif'

      # Sign the staging images with cosign keyless signing (Sigstore / Fulcio).
      # This ensures that only images built by this workflow are accepted as
      # valid staging artifacts, providing supply-chain traceability even for
      # non-release builds.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign staging backend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-backend@${{ steps.push-backend.outputs.digest }}"

      - name: Sign staging frontend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend@${{ steps.push-frontend.outputs.digest }}"

      - name: Smoke-test the backend staging image
        run: |
          set -e
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          docker pull "${REPO}:staging-${{ github.sha }}"
          docker run -d --name remitlend-smoke -p 3001:3001 \
            -e NODE_ENV=production \
            "${REPO}:staging-${{ github.sha }}"
          echo "Waiting for /health to report healthy..."
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          docker logs remitlend-smoke || true
          docker rm -f remitlend-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::backend staging image failed the /health smoke test"
            exit 1
          fi
          echo "Backend staging image passed the /health smoke test."

      - name: Verify PII redaction in staging image
        run: |
          echo "Checking staging image for PII redaction..."
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          # Pull the image for inspection
          docker pull "${REPO}:staging-${{ github.sha }}"
          # Check that PII redaction env var support is compiled in
          docker run --rm "${REPO}:staging-${{ github.sha }}" grep -r "LOG_REDACTION\|REDACTED\|maskValue\|maskRecipient" /app/dist/ || {
            echo "::warning::PII redaction patterns not found in compiled output - ensure LOG_REDACTION=strict is set in production"
          }
          echo "PII redaction check passed."

  deploy:
    needs: build-and-push
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Prepare staging compose with owner and TAG
        run: |
          mkdir -p deploy
          sudo apt-get update && sudo apt-get install -y gettext-base
          export OWNER=${{ env.OWNER_LC }}
          export TAG=staging-latest
