name: Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backup current staging-latest as staging-previous
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            if docker pull ${REPO}:staging-latest; then
              docker tag ${REPO}:staging-latest ${REPO}:staging-previous || true
              docker push ${REPO}:staging-previous || true
            fi
          done

      - name: Build and push backend
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-latest
          target: production
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build and push frontend
        id: push-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-latest
          target: runner

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RPC_URL=${{ vars.NEXT_PUBLIC_RPC_URL }}
            NEXT_PUBLIC_NETWORK_PASSPHRASE=${{ vars.NEXT_PUBLIC_NETWORK_PASSPHRASE }}
            NEXT_PUBLIC_EXPLORER_URL=${{ vars.NEXT_PUBLIC_EXPLORER_URL }}
            NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_LENDING_POOL_CONTRACT_ID || vars.NEXT_PUBLIC_MANAGER_CONTRACT_ID }}
            NEXT_PUBLIC_POOL_CONTRACT_ID=${{ vars.NEXT_PUBLIC_POOL_CONTRACT_ID }}
            NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID=${{ vars.NEXT_PUBLIC_GOVERNANCE_CONTRACT_ID }}
            NEXT_PUBLIC_NFT_CONTRACT_ID=${{ vars.NEXT_PUBLIC_NFT_CONTRACT_ID }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Run Trivy vulnerability scanner (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-backend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          # Without this, trivy-action builds the SARIF with ALL severities and
          # the exit-code then trips on any vulnerability (e.g. the existing
          # HIGH axios advisories) — not just CRITICAL as the step intends.
          # Limiting the report to the requested severity makes the gate fail
          # only on genuine CRITICAL findings.
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner for frontend (HIGH - warn)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'table'
          severity: 'HIGH'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Run Trivy vulnerability scanner for frontend (CRITICAL - fail)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend:staging-${{ github.sha }}'
          format: 'sarif'
          output: 'frontend-trivy-results.sarif'
          severity: 'CRITICAL'
          exit-code: '1'
          limit-severities-for-sarif: 'true'
          trivyignores: '.trivyignore'

      - name: Upload frontend Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'frontend-trivy-results.sarif'

      # Sign the staging images with cosign keyless signing (Sigstore / Fulcio).
      # This ensures that only images built by this workflow are accepted as
      # valid staging artifacts, providing supply-chain traceability even for
      # non-release builds.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign staging backend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-backend@${{ steps.push-backend.outputs.digest }}"

      - name: Sign staging frontend image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/${{ env.OWNER_LC }}/remitlend-frontend@${{ steps.push-frontend.outputs.digest }}"

      - name: Smoke-test the backend staging image
        run: |
          set -e
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          docker pull "${REPO}:staging-${{ github.sha }}"
          docker run -d --name remitlend-smoke -p 3001:3001 \
            -e NODE_ENV=production \
            "${REPO}:staging-${{ github.sha }}"
          echo "Waiting for /health to report healthy..."
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          docker logs remitlend-smoke || true
          docker rm -f remitlend-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::backend staging image failed the /health smoke test"
            exit 1
          fi
          echo "Backend staging image passed the /health smoke test."

      - name: Verify PII redaction in staging image
        run: |
          echo "Checking staging image for PII redaction..."
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          # Pull the image for inspection
          docker pull "${REPO}:staging-${{ github.sha }}"
          # Check that PII redaction env var support is compiled in
          docker run --rm "${REPO}:staging-${{ github.sha }}" grep -r "LOG_REDACTION\|REDACTED\|maskValue\|maskRecipient" /app/dist/ || {
            echo "::warning::PII redaction patterns not found in compiled output - ensure LOG_REDACTION=strict is set in production"
          }
          echo "PII redaction check passed."

  # Isolated staging environment: the canary image is exercised here before any
  # traffic is promoted. Synthetic journeys use non-value fixtures only.
  canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      canary-ok: ${{ steps.synthetic.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Start canary backend in isolated staging
        run: |
          set -e
          REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-backend
          docker pull "${REPO}:staging-${{ github.sha }}"
          docker run -d --name remitlend-canary -p 3001:3001 \
            -e NODE_ENV=production \
            -e SYNTHETIC_JOURNEYS=1 \
            "${REPO}:staging-${{ github.sha }}"
          echo "Waiting for canary /health..."
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then break; fi
            sleep 3
          done

      - name: Contract/API compatibility gate
        id: compat
        run: |
          set -e
          echo "Checking contract/API compatibility for canary..."
          # Fail the gate if the canary cannot serve the contract metadata the
          # frontend depends on. A mismatch blocks promotion.
          if ! curl -fsS http://localhost:3001/api/contracts/metadata >/dev/null 2>&1; then
            echo "::error::contract/API compatibility check failed - blocking promotion"
            exit 1
          fi
          echo "Contract/API compatibility OK."

      - name: Run synthetic financial journeys (read, preview, tx-status)
        id: synthetic
        run: |
          set -e
          echo "Running synthetic journeys against canary (no production funds, no real identities)..."
          # Read flow: list pools with synthetic fixtures.
          curl -fsS http://localhost:3001/api/pools >/dev/null
          # Preview flow: quote a synthetic borrow without submitting.
          curl -fsS -X POST http://localhost:3001/api/loans/preview \
            -H 'content-type: application/json' \
            -d '{"amount":"100","asset":"SYNTH","synthetic":true}' >/dev/null
          # Transaction-status flow: poll a synthetic tx id (never broadcast).
          curl -fsS http://localhost:3001/api/transactions/synthetic-status >/dev/null
          echo "ok=true" >> $GITHUB_OUTPUT
          echo "Synthetic journeys passed."

      - name: Stop canary
        if: always()
        run: docker rm -f remitlend-canary >/dev/null 2>&1 || true

  # Promotion gate: only runs when the canary synthetic journeys and the
  # contract/API compatibility check both pass. Contract deployment approvals
  # remain separately controlled and are not triggered here.
  promote:
    needs: [build-and-push, canary]
    if: ${{ needs.canary.outputs.canary-ok == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Record deployment evidence
        run: |
          set -e
          mkdir -p deploy/evidence
          cat > deploy/evidence/staging-${{ github.sha }}.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "backend_image_digest": "${{ needs.build-and-push.outputs.backend-digest }}",
            "frontend_image_digest": "${{ needs.build-and-push.outputs.frontend-digest }}",
            "config_version": "${{ vars.STAGING_CONFIG_VERSION }}",
            "gates": {
              "contract_api_compatibility": "passed",
              "synthetic_journeys": "passed"
            }
          }
          EOF
          cat deploy/evidence/staging-${{ github.sha }}.json

      - name: Promote canary to staging-latest
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            docker pull "${REPO}:staging-${{ github.sha }}"
            docker tag "${REPO}:staging-${{ github.sha }}" "${REPO}:staging-latest"
            docker push "${REPO}:staging-latest"
          done
          echo "Promoted staging-${{ github.sha }} to staging-latest."

  # Rollback path: restores the previous image without resubmitting pending
  # chain transactions. Database migrations are forward-compatible, so the
  # previous image can run against the current schema.
  rollback:
    needs: [build-and-push, canary]
    if: ${{ failure() && needs.canary.result == 'failure' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Roll back to staging-previous
        run: |
          set -e
          for img in backend frontend; do
            REPO=ghcr.io/${{ env.OWNER_LC }}/remitlend-${img}
            if docker pull "${REPO}:staging-previous"; then
              docker tag "${REPO}:staging-previous" "${REPO}:staging-latest"
              docker push "${REPO}:staging-latest"
            fi
          done
          echo "::warning::Rolled back to staging-previous. Pending chain transactions were not resubmitted."

  deploy:
    needs: [build-and-push, promote]
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Prepare staging compose with owner and TAG
        run: |
          mkdir -p deploy
          sudo apt-get update && sudo apt-get install -y gettext-base
          export OWNER=${{ env.OWNER_LC }}
          export TAG=staging-latest
