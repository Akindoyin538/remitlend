services:
  db:
    image: postgres:16.9-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remitlend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remitlend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: always
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP/HTTP receiver

  backend:
    build:
      context: ./backend
      target: builder
    command: sh -c "npm run migrate:up && npm run dev"
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/remitlend
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=remitlend-backend
      - PII_KEK_ID=${PII_KEK_ID:-default-kek}
      - PII_KMS_ENDPOINT=${PII_KMS_ENDPOINT:-}
      - PII_KEK_REGION=${PII_KEK_REGION:-}
      - PII_KEK_KEY=${PII_KEK_KEY:-}
      - LOG_REDACTION=${LOG_REDACTION:-strict}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001 # Client-side URL
      - API_URL=http://backend:3001 # Server-side URL
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

